<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Song List</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap');

    :root {
      color-scheme: light dark;
      --paper: #f5f2e9;
      --surface: #fffdf7;
      --ink: #171713;
      --muted: #605d55;
      --rule: #cfcbc0;
      --rule-strong: #8e897d;
      --accent: #cf3b1f;
      --accent-soft: #f1d2c8;
      --link: #194f73;
      --shadow: 0 12px 34px rgba(47, 42, 31, .09);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #171816;
        --surface: #20211e;
        --ink: #f2efe5;
        --muted: #b9b6ad;
        --rule: #3d3f39;
        --rule-strong: #74776c;
        --accent: #ff785c;
        --accent-soft: #512d27;
        --link: #8cc8ec;
        --shadow: 0 14px 38px rgba(0, 0, 0, .25);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(90deg, transparent 0, transparent calc(100% - 1px), color-mix(in srgb, var(--rule) 35%, transparent) calc(100% - 1px)) 0 0 / 42px 42px,
        var(--paper);
      color: var(--ink);
      font-family: "Source Sans 3", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    button, input { font: inherit; }
    a { color: inherit; }

    .wrap {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: clamp(24px, 5vw, 68px) clamp(16px, 4vw, 60px) 72px;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 24px;
      padding-bottom: 28px;
      border-bottom: 3px solid var(--ink);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.8rem, 7vw, 6.8rem);
      font-weight: 400;
      line-height: .88;
      letter-spacing: -.055em;
    }

    .lede {
      max-width: 500px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.2rem);
    }

    .count-block {
      text-align: right;
      white-space: nowrap;
    }

    .count-block strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 4rem);
      font-weight: 400;
      line-height: .9;
      color: var(--accent);
    }

    .count-block span {
      font-family: "IBM Plex Mono", monospace;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr);
      gap: 20px;
      padding: 20px 0;
      border-bottom: 1px solid var(--rule-strong);
    }

    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      min-height: 46px;
      padding: 10px 42px;
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      outline: none;
      background: var(--surface);
      color: var(--ink);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink) 5%, transparent);
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    #clearSearch {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.3rem;
      cursor: pointer;
    }
    #clearSearch[hidden] { display: none; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .filter {
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      line-height: 1.15;
    }

    .filter:hover { border-color: var(--accent); }
    .filter[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
    }
    .filter:focus-visible, a:focus-visible, #clearSearch:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
      outline-offset: 2px;
    }

    .results-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 14px 0 10px;
      font-family: "IBM Plex Mono", monospace;
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .catalog {
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .catalog-head, .song-row {
      display: grid;
      grid-template-columns: 56px minmax(180px, 1.65fr) minmax(140px, 1.1fr) minmax(170px, 1.3fr) minmax(105px, .7fr) 68px minmax(145px, 1fr) minmax(160px, 1fr);
      align-items: start;
    }

    .catalog-head {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--ink);
      color: var(--paper);
      font-family: "IBM Plex Mono", monospace;
      font-size: .67rem;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .catalog-head > span, .song-row > div { padding: 12px 10px; }
    .catalog-head > span:first-child, .song-row > div:first-child { padding-left: 16px; }

    .song-row {
      min-height: 80px;
      border-bottom: 1px solid var(--rule);
    }
    .song-row:last-child { border-bottom: 0; }
    .song-row:hover { background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }

    .num {
      font-family: "IBM Plex Mono", monospace;
      font-size: .73rem;
      color: var(--muted);
    }

    .song-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.16;
    }

    .band, .release { line-height: 1.25; }
    .date, .track, .role {
      font-size: .9rem;
      color: var(--muted);
    }

    .track { font-family: "IBM Plex Mono", monospace; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .listen-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      color: var(--link);
      font-size: .79rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      background: color-mix(in srgb, var(--link) 4%, var(--surface));
    }
    .listen-link:hover { border-color: currentColor; text-decoration: underline; }
    .listen-link svg { width: 11px; height: 11px; }
    .empty { color: var(--rule-strong); }

    .no-results {
      display: none;
      padding: 60px 20px;
      text-align: center;
      background: var(--surface);
      border-top: 1px solid var(--rule);
    }
    .no-results.visible { display: block; }
    .no-results h2 {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      font-weight: 400;
    }
    .no-results p { margin: 0; color: var(--muted); }

    .load-error {
      margin: 28px 0;
      padding: 18px;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1050px) {
      .catalog-head, .song-row {
        grid-template-columns: 48px minmax(170px, 1.4fr) minmax(135px, 1fr) minmax(160px, 1.1fr) 78px minmax(140px, 1fr) minmax(145px, 1fr);
      }
      .track-head, .track-cell { display: none; }
    }

    @media (max-width: 780px) {
      body { background: var(--paper); }
      .wrap { padding: 26px 14px 48px; }
      .intro { grid-template-columns: 1fr; gap: 18px; }
      h1 { font-size: clamp(2.7rem, 14vw, 4.5rem); }
      .count-block { text-align: left; }
      .count-block strong { display: inline; margin-right: 6px; }
      .controls { grid-template-columns: 1fr; }
      .filters { justify-content: flex-start; }
      .filter { padding-inline: 11px; font-size: .89rem; }
      .catalog { background: transparent; box-shadow: none; }
      .catalog-head { display: none; }
      .song-row {
        position: relative;
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 0 10px;
        min-height: 0;
        margin-bottom: 12px;
        padding: 16px 14px 16px 0;
        border: 1px solid var(--rule);
        background: var(--surface);
        box-shadow: 0 5px 14px color-mix(in srgb, var(--ink) 5%, transparent);
      }
      .song-row > div { padding: 0; }
      .song-row > div:first-child { padding-left: 12px; }
      .num { grid-row: 1 / 7; text-align: center; padding-top: 3px !important; }
      .song-title { grid-column: 2; margin-bottom: 5px; font-size: 1.2rem; }
      .band { grid-column: 2; font-weight: 700; color: var(--accent); }
      .release { grid-column: 2; margin-top: 8px; }
      .date { grid-column: 2; margin-top: 2px; }
      .role { grid-column: 2; margin-top: 8px; }
      .links { grid-column: 2; margin-top: 12px; }
      .track-cell { display: block; grid-column: 2; margin-top: 4px; }
      .track-cell::before { content: "Track "; font-family: "Source Sans 3", sans-serif; }
      .listen-link { min-height: 34px; padding: 8px 10px; }
    }

    @media (max-width: 430px) {
      .results-line { align-items: flex-end; }
      .results-line span:last-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="intro">
      <div>
        <h1>95 songs,<br>five bands.</h1>
        <p class="lede">A chronological catalog of Paul Wisner’s recorded, released, and documented songs.</p>
      </div>
      <div class="count-block" aria-label="95 songs total">
        <strong id="heroCount">95</strong>
        <span>songs cataloged</span>
      </div>
    </header>

    <section class="controls" aria-label="Catalog controls">
      <div class="search-wrap">
        <label class="sr-only" for="search">Search songs, bands, releases, or roles</label>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="search" type="search" placeholder="Search songs, bands, releases…" autocomplete="off">
        <button id="clearSearch" type="button" aria-label="Clear search" hidden>×</button>
      </div>
      <div class="filters" role="group" aria-label="Filter by band">
        <button class="filter" type="button" data-band="All" aria-pressed="true">All</button>
        <button class="filter" type="button" data-band="Ultrabreakfast" aria-pressed="false">Ultrabreakfast</button>
        <button class="filter" type="button" data-band="Calendar Girl" aria-pressed="false">Calendar Girl</button>
        <button class="filter" type="button" data-band="Stever Must Lead the Rebellion" aria-pressed="false">Stever Must Lead</button>
        <button class="filter" type="button" data-band="Miskatonic" aria-pressed="false">Miskatonic</button>
        <button class="filter" type="button" data-band="Ghosts and Shadows" aria-pressed="false">Ghosts and Shadows</button>
      </div>
    </section>

    <div class="results-line" aria-live="polite">
      <span id="resultCount">Loading catalog…</span>
      <span>Bandcamp → Spotify → other</span>
    </div>

    <section class="catalog" aria-label="Song catalog">
      <div class="catalog-head" aria-hidden="true">
        <span>No.</span><span>Song</span><span>Band</span><span>Release</span><span>Date</span><span class="track-head">Track</span><span>Paul’s role</span><span>Listen</span>
      </div>
      <div id="rows"></div>
      <div class="no-results" id="noResults">
        <h2>No matching songs</h2>
        <p>Try a different title, release, or band.</p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';
      var songs = [];
      var selectedBand = 'All';
      var searchInput = document.getElementById('search');
      var clearButton = document.getElementById('clearSearch');
      var rows = document.getElementById('rows');
      var resultCount = document.getElementById('resultCount');
      var heroCount = document.getElementById('heroCount');
      var noResults = document.getElementById('noResults');
      var filters = Array.prototype.slice.call(document.querySelectorAll('.filter'));

      function text(value) {
        return value === null || value === undefined || value === '' ? '—' : String(value);
      }

      function escapeHtml(value) {
        return text(value).replace(/[&<>"']/g, function (char) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char];
        });
      }

      function linkMarkup(link) {
        if (!link || !link.url) return '';
        var label = link.label || 'Listen';
        return '<a class="listen-link" href="' + escapeHtml(link.url) + '" target="_blank" rel="noopener noreferrer">' +
          escapeHtml(label) + '<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 11 11 5M6 5h5v5"></path></svg></a>';
      }

      function render() {
        var query = searchInput.value.trim().toLowerCase();
        var visible = songs.filter(function (song) {
          var bandMatches = selectedBand === 'All' || song.band === selectedBand;
          var haystack = [song.song, song.band, song.release, song.date, song.track, song.role].filter(Boolean).join(' ').toLowerCase();
          return bandMatches && (!query || haystack.indexOf(query) !== -1);
        });

        rows.innerHTML = visible.map(function (song) {
          var links = [song.bandcamp, song.spotify, song.other].map(linkMarkup).join('');
          return '<article class="song-row" aria-label="Song ' + escapeHtml(song.n) + ': ' + escapeHtml(song.song) + '">' +
            '<div class="num">' + String(song.n).padStart(2, '0') + '</div>' +
            '<div class="song-title">' + escapeHtml(song.song) + '</div>' +
            '<div class="band">' + escapeHtml(song.band) + '</div>' +
            '<div class="release">' + escapeHtml(song.release) + '</div>' +
            '<div class="date">' + escapeHtml(song.date) + '</div>' +
            '<div class="track track-cell">' + escapeHtml(song.track) + '</div>' +
            '<div class="role">' + escapeHtml(song.role) + '</div>' +
            '<div class="links">' + (links || '<span class="empty">—</span>') + '</div>' +
          '</article>';
        }).join('');

        var noun = visible.length === 1 ? 'song' : 'songs';
        resultCount.textContent = visible.length + ' ' + noun + (selectedBand === 'All' ? '' : ' · ' + selectedBand);
        noResults.classList.toggle('visible', visible.length === 0);
        clearButton.hidden = !searchInput.value;
      }

      filters.forEach(function (button) {
        button.addEventListener('click', function () {
          selectedBand = button.getAttribute('data-band');
          filters.forEach(function (item) {
            item.setAttribute('aria-pressed', item === button ? 'true' : 'false');
          });
          render();
        });
      });

      searchInput.addEventListener('input', render);
      clearButton.addEventListener('click', function () {
        searchInput.value = '';
        searchInput.focus();
        render();
